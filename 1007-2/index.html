<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css" type="text/css" />
  </head>
  <body>
    <!-- 網站最上方的 Logo 與標語 -->
    <div class="container mt-4">
        <div class="site-logo">FTDBLUEMOOD</div>
        <div class="site-slogan">SMALL COMPANY SLOGAN GOES HERE</div>
    </div>

    

    <!-- 主要白色內容區塊 -->
    <div class="container main-container">
      <div class="row">
        <div class="col-12">
          <div class="main-wrapper">

    <header id="masthead" class="container">
      <!-- 原本的單張圖片改為 Bootstrap 5 Carousel 輪播圖 -->
      <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <!-- 輪播指示點 -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="4" aria-label="Slide 5"></button>                    
        </div>

        <!-- 輪播圖片內容 -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/header.jpg" class="d-block w-100" alt="tokyo buildings">
            </div>
            <div class="carousel-item">
                <!-- 請替換為您的第二張圖片路徑 -->
                <img src="images/header2.jpg" class="d-block w-100" alt="mark in japan">
            </div>
            <div class="carousel-item">
                <!-- 請替換為您的第三張圖片路徑 -->
                <img src="images/header3.jpg" class="d-block w-100" alt="a2g">
            </div>
            <div class="carousel-item">
                <!-- 請替換為您的第四張圖片路徑 -->
                <img src="images/header4.jpg" class="d-block w-100" alt="mark in japan">
            </div>
        </div>
        <!-- 左右切換按鈕 -->
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- 漸層導覽列 -->
    <nav class="gradient-nav d-flex justify-content-center gap-5 mt-1 mb-4">
        <a href="#">Home</a>
        <a href="#">Blog</a>
        <a href="#">Gallery</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

    </header>


  </body>
</html>
