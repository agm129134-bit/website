<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景圓角矩形 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- 科技光環軌道 -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" />

  <!-- 核心立體書卷 / 次元傳送門 (Holographic Book Portal) -->
  <g filter="url(#neonGlow)" transform="translate(0, -10)">
    <!-- 左頁 -->
    <path d="M 256 360 C 210 330, 130 330, 96 350 L 96 190 C 130 170, 210 170, 256 200 Z" 
          fill="url(#accentGrad)" opacity="0.9" />
    <!-- 右頁 -->
    <path d="M 256 360 C 302 330, 382 330, 416 350 L 416 190 C 382 170, 302 170, 256 200 Z" 
          fill="url(#accentGrad)" opacity="0.95" />
    <!-- 書脊光束 -->
    <line x1="256" y1="190" x2="256" y2="365" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- 頁面內部微光符文線條 -->
    <path d="M 125 225 Q 170 210 230 230" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
    <path d="M 125 255 Q 170 240 230 260" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
    <path d="M 125 285 Q 170 270 230 290" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />

    <path d="M 282 230 Q 342 210 387 225" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
    <path d="M 282 260 Q 342 240 387 255" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
    <path d="M 282 290 Q 342 270 387 285" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 躍出次元的 ACG 星芒 (Dynamic Sparkle) -->
  <g transform="translate(256, 150)" filter="url(#neonGlow)">
    <polygon points="0,-45 12,-12 45,0 12,12 0,45 -12,12 -45,0 -12,-12" fill="url(#glowGrad)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- 漂浮小星芒 -->
  <circle cx="120" cy="130" r="6" fill="#38bdf8" opacity="0.8" />
  <circle cx="390" cy="120" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="420" cy="380" r="7" fill="#fbbf24" opacity="0.7" />
  <circle cx="90" cy="390" r="5" fill="#a855f7" opacity="0.7" />
</svg>
