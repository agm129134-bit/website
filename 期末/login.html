<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 / 註冊 - Web Library 個人化網頁收藏圖書館</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- GSAP 3 專業動態庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            padding: 32px 28px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background-color: #0f172a;
            color: #ffffff;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        /* 登入 / 註冊 分頁切換藥丸列 */
        .auth-nav-tabs {
            background-color: #f1f5f9;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }

        .auth-tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .auth-tab-btn.active {
            background-color: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }

        .auth-tab-btn:hover:not(.active) {
            color: #0f172a;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a !important;
            font-size: 0.95rem;
            padding: 10px 14px;
            border-radius: 8px;
            transition: all 0.15s ease-in-out;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
            color: #0f172a !important;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .btn-login {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 11px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background-color: #1e293b;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
        }

        .btn-register {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 11px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            background-color: #1d4ed8;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .demo-chip {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #334155;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .demo-chip:hover {
            background-color: #e2e8f0;
            color: #0f172a;
            border-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- 品牌與標題 -->
        <div class="text-center mb-3">
            <div class="brand-icon">
                <i class="bi bi-bookmark-fill"></i>
            </div>
            <h4 class="fw-bold mb-1 text-dark">Web Library</h4>
            <p class="text-secondary small mb-0">個人化網頁收藏圖書館 · 期末專案</p>
        </div>

        <!-- 登入 / 註冊 雙模式切換分頁 -->
        <div class="auth-nav-tabs" id="authNavTabs">
            <button type="button" class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthMode('login')">
                <i class="bi bi-box-arrow-in-right"></i> 會員登入
            </button>
            <button type="button" class="auth-tab-btn" id="tabRegisterBtn" onclick="switchAuthMode('register')">
                <i class="bi bi-person-plus-fill"></i> 註冊新帳號
            </button>
        </div>

        <!-- 一鍵填入展示帳號 (僅於登入分頁呈現) -->
        <div class="mb-3 p-2 bg-light rounded-2 border" id="demoAccountsBox">
            <div class="text-secondary small mb-2 fw-semibold d-flex align-items-center justify-content-between">
                <span><i class="bi bi-person-badge"></i> 評分展示帳號：</span>
                <span class="text-muted" style="font-size: 0.75rem;">點擊自動帶入</span>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn demo-chip flex-fill text-center" onclick="fillAccount('admin', '***REMOVED***')">
                    <i class="bi bi-shield-check text-primary"></i> 管理員 (admin)
                </button>
                <button type="button" class="btn demo-chip flex-fill text-center" onclick="fillAccount('student', '***REMOVED***')">
                    <i class="bi bi-mortarboard text-success"></i> 學生 (student)
                </button>
            </div>
        </div>

        <!-- 錯誤或警告提示框 -->
        <div id="loginAlertBox" class="alert alert-danger py-2 px-3 small d-none rounded-2 mb-3">
            <i class="bi bi-exclamation-circle-fill me-1"></i> <span id="loginAlertText">請填寫完整的帳號與密碼</span>
        </div>

        <!-- ==================== 1. 登入表單 (Login Form) ==================== -->
        <form id="loginForm" novalidate>
            <!-- 帳號 -->
            <div class="mb-3">
                <label for="usernameInput" class="form-label">使用者帳號</label>
                <input type="text" class="form-control" id="usernameInput" placeholder="請輸入註冊帳號 (例如: admin)" required autofocus autocomplete="username">
            </div>

            <!-- 密碼 -->
            <div class="mb-3">
                <label for="passwordInput" class="form-label">登入密碼</label>
                <div class="input-group">
                    <input type="password" class="form-control border-end-0" id="passwordInput" placeholder="請輸入密碼 (例如: ***REMOVED***)" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="togglePasswordBtn" title="顯示或隱藏密碼" style="border-color: #cbd5e1;">
                        <i class="bi bi-eye-slash text-secondary" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- 記住我 -->
            <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="rememberMeCheckbox" checked>
                    <label class="form-check-label text-secondary small" for="rememberMeCheckbox">
                        記住登入狀態 (30 天)
                    </label>
                </div>
                <button type="button" class="btn btn-link text-decoration-none small p-0 text-primary fw-medium" onclick="switchAuthMode('forgot')">
                    <i class="bi bi-question-circle me-1"></i>忘記密碼？
                </button>
            </div>

            <!-- 登入按鈕 -->
            <button type="submit" class="btn btn-login w-100 d-flex align-items-center justify-content-center gap-2" id="submitLoginBtn">
                <span id="submitSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                <span id="submitBtnText"><i class="bi bi-box-arrow-in-right"></i> 立即登入</span>
            </button>

            <!-- 切換註冊引導 -->
            <div class="text-center mt-3 pt-2">
                <span class="text-muted small">還沒有專屬帳號？</span>
                <button type="button" class="btn btn-link text-primary text-decoration-none small p-0 fw-semibold" onclick="switchAuthMode('register')">
                    立即註冊一個 →
                </button>
            </div>

            <!-- 訪客體驗 -->
            <div class="text-center mt-2 pt-2 border-top">
                <button type="button" class="btn btn-link text-secondary text-decoration-none small p-0" onclick="guestLogin()">
                    訪客快速體驗通道 →
                </button>
            </div>
        </form>

        <!-- ==================== 2. 註冊表單 (Register Form) ==================== -->
        <form id="registerForm" class="d-none" novalidate>
            <!-- 註冊帳號 -->
            <div class="mb-3">
                <label for="regUsernameInput" class="form-label">設定使用者帳號 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="regUsernameInput" placeholder="請設定帳號 (至少3碼，英文/數字)" required autocomplete="username">
            </div>

            <!-- 顯示暱稱 -->
            <div class="mb-3">
                <label for="regNameInput" class="form-label">顯示暱稱 / 姓名 <span class="text-muted small fw-normal">(選填)</span></label>
                <input type="text" class="form-control" id="regNameInput" placeholder="例如: 小明 / ACG同好 (未填同帳號)">
            </div>

            <!-- 註冊密碼 -->
            <div class="mb-3">
                <label for="regPasswordInput" class="form-label">設定登入密碼 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="password" class="form-control border-end-0" id="regPasswordInput" placeholder="請設定密碼 (至少4碼)" required autocomplete="new-password">
                    <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="toggleRegPasswordBtn" title="顯示或隱藏密碼" style="border-color: #cbd5e1;">
                        <i class="bi bi-eye-slash text-secondary" id="toggleRegPasswordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- 確認密碼 -->
            <div class="mb-4">
                <label for="regConfirmPasswordInput" class="form-label">再次確認密碼 <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="regConfirmPasswordInput" placeholder="請再次輸入上方密碼" required autocomplete="new-password">
            </div>

            <!-- 註冊按鈕 -->
            <button type="submit" class="btn btn-register w-100 d-flex align-items-center justify-content-center gap-2" id="submitRegBtn">
                <span id="submitRegSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                <span id="submitRegBtnText"><i class="bi bi-person-check-fill"></i> 立即註冊並進入</span>
            </button>

            <!-- 返回登入引導 -->
            <div class="text-center mt-3 pt-2 border-top">
                <span class="text-muted small">已經擁有帳號？</span>
                <button type="button" class="btn btn-link text-dark text-decoration-none small p-0 fw-semibold" onclick="switchAuthMode('login')">
                    ← 返回登入頁面
                </button>
            </div>
        </form>

        <!-- ==================== 3. 忘記密碼表單 (Forgot Password Form) ==================== -->
        <form id="forgotForm" class="d-none" novalidate>
            <div class="alert alert-info py-2 px-3 small rounded-2 mb-3">
                <i class="bi bi-info-circle-fill me-1"></i> 請輸入註冊時的帳號以重新設定登入密碼。
            </div>

            <!-- 帳號 -->
            <div class="mb-3">
                <label for="forgotUsernameInput" class="form-label">您的使用者帳號 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="forgotUsernameInput" placeholder="請輸入註冊帳號 (例如: admin)" required autocomplete="username">
            </div>

            <!-- 新密碼 -->
            <div class="mb-3">
                <label for="forgotPasswordInput" class="form-label">設定全新密碼 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="password" class="form-control border-end-0" id="forgotPasswordInput" placeholder="請設定新密碼 (至少4碼)" required autocomplete="new-password">
                    <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="toggleForgotPwdBtn" title="顯示或隱藏密碼" style="border-color: #cbd5e1;">
                        <i class="bi bi-eye-slash text-secondary" id="toggleForgotPwdIcon"></i>
                    </button>
                </div>
            </div>

            <!-- 確認新密碼 -->
            <div class="mb-4">
                <label for="forgotConfirmPasswordInput" class="form-label">再次確認新密碼 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="password" class="form-control border-end-0" id="forgotConfirmPasswordInput" placeholder="請再次輸入上方新密碼" required autocomplete="new-password">
                    <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="toggleForgotConfirmPwdBtn" title="顯示或隱藏密碼" style="border-color: #cbd5e1;">
                        <i class="bi bi-eye-slash text-secondary" id="toggleForgotConfirmPwdIcon"></i>
                    </button>
                </div>
            </div>

            <!-- 重設按鈕 -->
            <button type="submit" class="btn btn-dark w-100 d-flex align-items-center justify-content-center gap-2 py-2" id="submitForgotBtn" style="border-radius: 8px; font-weight: 600;">
                <span id="submitForgotSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                <span id="submitForgotBtnText"><i class="bi bi-shield-lock-fill"></i> 立即重設密碼</span>
            </button>

            <!-- 返回登入引導 -->
            <div class="text-center mt-3 pt-2 border-top">
                <button type="button" class="btn btn-link text-secondary text-decoration-none small p-0 fw-semibold" onclick="switchAuthMode('login')">
                    ← 想起密碼了？返回會員登入
                </button>
            </div>
        </form>
    </div>


    <!-- ==================== 哈哈你用了相同的密碼 大字報彩蛋 Modal ==================== -->
    <div class="modal fade" id="samePasswordEasterEggModal" tabindex="-1" aria-labelledby="samePasswordModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; overflow: hidden; background: linear-gradient(145deg, #ffffff, #f8fafc);">
                <div class="modal-body text-center p-4 p-sm-5">
                    <div class="mb-3" style="font-size: 4.5rem; line-height: 1; filter: drop-shadow(0 8px 16px rgba(251, 191, 36, 0.4)); animation: pulseEasterEgg 1.5s infinite alternate;">
                        🤣
                    </div>
                    <div class="badge bg-warning text-dark px-3 py-1 rounded-pill fw-bold mb-2 fs-6">
                        <i class="bi bi-patch-exclamation-fill me-1"></i> 密碼重設彩蛋觸發
                    </div>
                    <h3 class="fw-black text-dark mb-2" style="font-size: 1.75rem; letter-spacing: -0.5px;">
                        哈哈！你用了跟之前一模一樣的密碼！
                    </h3>
                    <p class="text-muted small mb-4 px-2" style="line-height: 1.6;">
                        雖然你輸入的「新密碼」跟原本的密碼完全一模一樣，但系統還是非常體貼地幫你完成了整套安全驗證與重設刷新流程～下次記得不要自己嚇自己囉！😂🔐
                    </p>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-primary btn-lg fw-bold rounded-pill shadow-sm" id="easterEggConfirmBtn">
                            <i class="bi bi-box-arrow-in-right me-1"></i> 好啦！直接幫我登入
                        </button>
                        <button type="button" class="btn btn-outline-secondary rounded-pill btn-sm" data-bs-dismiss="modal">
                            留在當前頁面
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <style>
        @keyframes pulseEasterEgg {
            0% { transform: scale(0.92) rotate(-3deg); }
            100% { transform: scale(1.08) rotate(3deg); }
        }
    </style>

    <!-- Toast 提示容器 -->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1090;">
        <div id="loginToast" class="toast align-items-center text-bg-dark border-0 rounded-3 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" id="toastMessage">
                    <i class="bi bi-check-circle-fill text-success fs-5"></i>
                    <span>登入成功！正在進入圖書館...</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. 徹底掃除本機歷史 localStorage 殘留，杜絕任何硬碟持久化依賴 (遵守全域無 localStorage 鐵律)
        try {
            localStorage.clear();
        } catch (e) {}

        // 2. 檢查當前瀏覽器分頁會話 (sessionStorage) 是否已登入，若已登入自動跳轉首頁
        (function checkAlreadyLoggedIn() {
            const current = sessionStorage.getItem('currentUser');
            if (current) {
                try {
                    const userObj = JSON.parse(current);
                    if (userObj && userObj.username) {
                        window.location.replace('index.html');
                    }
                } catch (e) {
                    sessionStorage.removeItem('currentUser');
                }
            }
        })();

        // 3. 模式切換 (登入 / 註冊 / 忘記密碼)
        function switchAuthMode(mode) {
            hideAlert();
            const isLogin = mode === 'login';
            const isForgot = mode === 'forgot';
            const tabLogin = document.getElementById('tabLoginBtn');
            const tabReg = document.getElementById('tabRegisterBtn');
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const forgotForm = document.getElementById('forgotForm');
            const demoBox = document.getElementById('demoAccountsBox');

            if (isForgot) {
                if (tabLogin) tabLogin.classList.remove('active');
                if (tabReg) tabReg.classList.remove('active');
                if (demoBox) demoBox.classList.add('d-none');
                if (loginForm) loginForm.classList.add('d-none');
                if (regForm) regForm.classList.add('d-none');
                if (forgotForm) forgotForm.classList.remove('d-none');
                document.getElementById('forgotUsernameInput')?.focus();
                if (typeof gsap !== 'undefined' && forgotForm) {
                    gsap.fromTo(forgotForm, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" });
                }
                return;
            }

            if (forgotForm) forgotForm.classList.add('d-none');

            if (isLogin) {
                tabLogin?.classList.add('active');
                tabReg?.classList.remove('active');
                demoBox?.classList.remove('d-none');
                loginForm?.classList.remove('d-none');
                regForm?.classList.add('d-none');
                document.getElementById('usernameInput')?.focus();

                if (typeof gsap !== 'undefined' && loginForm) {
                    gsap.fromTo(loginForm, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" });
                }
            } else {
                tabReg?.classList.add('active');
                tabLogin?.classList.remove('active');
                demoBox?.classList.add('d-none');
                loginForm?.classList.add('d-none');
                regForm?.classList.remove('d-none');
                document.getElementById('regUsernameInput')?.focus();

                if (typeof gsap !== 'undefined' && regForm) {
                    gsap.fromTo(regForm, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" });
                }
            }
        }

        // 4. 密碼切換顯示/隱藏
        function setupPasswordToggle(btnId, inputId, iconId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!btn || !input || !icon) return;

            btn.addEventListener('click', () => {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'bi bi-eye text-primary' : 'bi bi-eye-slash text-secondary';
            });
        }
        setupPasswordToggle('togglePasswordBtn', 'passwordInput', 'togglePasswordIcon');
        setupPasswordToggle('toggleRegPasswordBtn', 'regPasswordInput', 'toggleRegPasswordIcon');
        setupPasswordToggle('toggleForgotPwdBtn', 'forgotPasswordInput', 'toggleForgotPwdIcon');
        setupPasswordToggle('toggleForgotConfirmPwdBtn', 'forgotConfirmPasswordInput', 'toggleForgotConfirmPwdIcon');

        // 5. 一鍵填入展示帳號
        function fillAccount(username, password) {
            switchAuthMode('login');
            const uInput = document.getElementById('usernameInput');
            const pInput = document.getElementById('passwordInput');
            if (uInput) uInput.value = username;
            if (pInput) pInput.value = password;
            hideAlert();
            showToast(`已自動帶入展示帳號 (${username})`, "bi-check-circle text-success");
            pInput?.focus();
        }

        // 6. 錯誤提示與 Toast 訊息
        function showAlert(msg) {
            const alertBox = document.getElementById('loginAlertBox');
            const alertText = document.getElementById('loginAlertText');
            if (alertText) alertText.innerHTML = msg;
            if (alertBox) {
                alertBox.classList.remove('d-none');
                if (typeof gsap !== 'undefined') {
                    gsap.fromTo(alertBox, { scale: 0.95, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" });
                }
            }
        }

        function hideAlert() {
            const alertBox = document.getElementById('loginAlertBox');
            if (alertBox) alertBox.classList.add('d-none');
        }

        function showToast(message, iconClass = "bi-check-circle-fill text-success") {
            const toastEl = document.getElementById('loginToast');
            const toastMsg = document.getElementById('toastMessage');
            if (toastMsg) toastMsg.innerHTML = `<i class="bi ${iconClass} fs-5"></i> <span>${message}</span>`;
            if (toastEl && typeof bootstrap !== 'undefined') {
                const toast = new bootstrap.Toast(toastEl, { delay: 2600 });
                toast.show();
            }
        }

        // 7. 訪客快速體驗 (僅寫入 sessionStorage，無本機磁碟殘留)
        function guestLogin() {
            const guestUser = {
                username: "guest",
                name: "訪客使用者",
                role: "訪客",
                loginTime: new Date().toISOString()
            };
            sessionStorage.setItem('currentUser', JSON.stringify(guestUser));
            showToast("以訪客身分登入，正在跳轉...", "bi-person-check text-info");
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }

        // ==================== 8. 登入表單提交處理 (向 NeDB 後端驗證加鹽雜湊密碼) ====================
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                hideAlert();

                const username = document.getElementById('usernameInput')?.value.trim();
                const password = document.getElementById('passwordInput')?.value.trim();

                if (!username) {
                    showAlert('請輸入使用者帳號');
                    document.getElementById('usernameInput')?.focus();
                    return;
                }

                if (!password) {
                    showAlert('請輸入登入密碼');
                    document.getElementById('passwordInput')?.focus();
                    return;
                }

                const submitBtn = document.getElementById('submitLoginBtn');
                const spinner = document.getElementById('submitSpinner');
                const btnText = document.getElementById('submitBtnText');
                if (submitBtn) submitBtn.disabled = true;
                if (spinner) spinner.classList.remove('d-none');
                if (btnText) btnText.textContent = "驗證中...";

                try {
                    const res = await fetch('/api/user/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();

                    if (!res.ok || !data.success) {
                        if (submitBtn) submitBtn.disabled = false;
                        if (spinner) spinner.classList.add('d-none');
                        if (btnText) btnText.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> 立即登入';
                        showAlert(data.error || '登入失敗，請確認帳號與密碼');
                        return;
                    }

                    if (btnText) btnText.textContent = "驗證成功，正在進入...";
                    const user = data.user;
                    sessionStorage.setItem('currentUser', JSON.stringify(user));

                    showToast(`歡迎回來，${user.name || user.username}！`, "bi-check-circle-fill text-success");
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 400);
                } catch (err) {
                    if (submitBtn) submitBtn.disabled = false;
                    if (spinner) spinner.classList.add('d-none');
                    if (btnText) btnText.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> 立即登入';
                    showAlert('無法連線至伺服器驗證，請確認後端服務是否已啟動');
                }
            });
        }

        // ==================== 9. 註冊表單提交處理 (NeDB 加鹽雜湊持久化) ====================
        const registerForm = document.getElementById('registerForm');
        if (registerForm) {
            registerForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                hideAlert();

                const regUsername = document.getElementById('regUsernameInput')?.value.trim();
                const regName = document.getElementById('regNameInput')?.value.trim() || regUsername;
                const regPassword = document.getElementById('regPasswordInput')?.value.trim();
                const regConfirmPassword = document.getElementById('regConfirmPasswordInput')?.value.trim();

                if (!regUsername) {
                    showAlert('請設定使用者帳號');
                    document.getElementById('regUsernameInput')?.focus();
                    return;
                }

                if (regUsername.length < 3) {
                    showAlert('帳號長度不得少於 3 個字元');
                    document.getElementById('regUsernameInput')?.focus();
                    return;
                }

                if (!/^[a-zA-Z0-9_一-龥]+$/.test(regUsername)) {
                    showAlert('帳號僅支援中英文字母、數字與底線');
                    document.getElementById('regUsernameInput')?.focus();
                    return;
                }

                if (!regPassword) {
                    showAlert('請設定登入密碼');
                    document.getElementById('regPasswordInput')?.focus();
                    return;
                }

                if (regPassword.length < 3) {
                    showAlert('密碼長度不得少於 3 碼');
                    document.getElementById('regPasswordInput')?.focus();
                    return;
                }

                if (regPassword !== regConfirmPassword) {
                    showAlert('兩次輸入的密碼不一致，請重新確認！');
                    document.getElementById('regConfirmPasswordInput')?.focus();
                    return;
                }

                const submitRegBtn = document.getElementById('submitRegBtn');
                const submitRegSpinner = document.getElementById('submitRegSpinner');
                const submitRegBtnText = document.getElementById('submitRegBtnText');
                if (submitRegBtn) submitRegBtn.disabled = true;
                if (submitRegSpinner) submitRegSpinner.classList.remove('d-none');
                if (submitRegBtnText) submitRegBtnText.textContent = "註冊中...";

                try {
                    const res = await fetch('/api/user/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: regUsername,
                            name: regName,
                            password: regPassword,
                            role: '註冊會員'
                        })
                    });
                    const data = await res.json();

                    if (!res.ok || !data.success) {
                        if (submitRegBtn) submitRegBtn.disabled = false;
                        if (submitRegSpinner) submitRegSpinner.classList.add('d-none');
                        if (submitRegBtnText) submitRegBtnText.innerHTML = '<i class="bi bi-person-plus-fill"></i> 立即註冊帳號';
                        showAlert(data.error || '註冊失敗，請更換帳號');
                        return;
                    }

                    const user = data.user;
                    sessionStorage.setItem('currentUser', JSON.stringify(user));

                    showToast(`🎉 註冊成功！歡迎加入，${user.name || user.username}！`, "bi-check-circle-fill text-success");
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } catch (err) {
                    if (submitRegBtn) submitRegBtn.disabled = false;
                    if (submitRegSpinner) submitRegSpinner.classList.add('d-none');
                    if (submitRegBtnText) submitRegBtnText.innerHTML = '<i class="bi bi-person-plus-fill"></i> 立即註冊帳號';
                    showAlert('無法連線至伺服器註冊，請稍候再試');
                }
            });
        }

        // ==================== 10. 忘記密碼表單提交處理 (NeDB 安全重設與同密碼彩蛋) ====================
        let pendingEasterEggUser = null;

        const forgotForm = document.getElementById('forgotForm');
        if (forgotForm) {
            forgotForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                hideAlert();

                const username = (document.getElementById('forgotUsernameInput')?.value || '').trim();
                const newPassword = (document.getElementById('forgotPasswordInput')?.value || '').trim();
                const confirmPassword = (document.getElementById('forgotConfirmPasswordInput')?.value || '').trim();

                if (!username) {
                    showAlert('請輸入要重設密碼的使用者帳號');
                    document.getElementById('forgotUsernameInput')?.focus();
                    return;
                }

                if (!newPassword) {
                    showAlert('請設定全新密碼');
                    document.getElementById('forgotPasswordInput')?.focus();
                    return;
                }

                if (newPassword.length < 3) {
                    showAlert('新密碼長度不得少於 3 碼');
                    document.getElementById('forgotPasswordInput')?.focus();
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showAlert('兩次輸入的新密碼不一致，請重新確認！');
                    document.getElementById('forgotConfirmPasswordInput')?.focus();
                    return;
                }

                const submitForgotBtn = document.getElementById('submitForgotBtn');
                const submitForgotSpinner = document.getElementById('submitForgotSpinner');
                const submitForgotBtnText = document.getElementById('submitForgotBtnText');
                if (submitForgotBtn) submitForgotBtn.disabled = true;
                if (submitForgotSpinner) submitForgotSpinner.classList.remove('d-none');
                if (submitForgotBtnText) submitForgotBtnText.textContent = "處理中...";

                try {
                    const res = await fetch('/api/user/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, newPassword })
                    });
                    const data = await res.json();

                    if (submitForgotBtn) submitForgotBtn.disabled = false;
                    if (submitForgotSpinner) submitForgotSpinner.classList.add('d-none');
                    if (submitForgotBtnText) submitForgotBtnText.innerHTML = '<i class="bi bi-shield-lock-fill"></i> 立即重設密碼';

                    if (!res.ok || !data.success) {
                        showAlert(data.error || '密碼重設失敗');
                        return;
                    }

                    if (data.isSamePassword || data.samePassword) {
                        pendingEasterEggUser = { username: username, name: username, role: '一般會員' };
                        const easterEggModalEl = document.getElementById('samePasswordEasterEggModal');
                        if (easterEggModalEl && typeof bootstrap !== 'undefined') {
                            const easterEggModal = bootstrap.Modal.getOrCreateInstance(easterEggModalEl);
                            easterEggModal.show();
                        } else {
                            showAlert('🎉 哈哈！你用了跟之前一模一樣的密碼！密碼已完成刷新。');
                        }
                    } else {
                        showToast('🎉 密碼重設成功！請使用新密碼登入。', 'bi-check-circle-fill text-success');
                        switchAuthMode('login');
                        const userInput = document.getElementById('usernameInput');
                        const pwdInput = document.getElementById('passwordInput');
                        if (userInput) userInput.value = username;
                        if (pwdInput) {
                            pwdInput.value = newPassword;
                            pwdInput.focus();
                        }
                    }
                } catch (err) {
                    if (submitForgotBtn) submitForgotBtn.disabled = false;
                    if (submitForgotSpinner) submitForgotSpinner.classList.add('d-none');
                    if (submitForgotBtnText) submitForgotBtnText.innerHTML = '<i class="bi bi-shield-lock-fill"></i> 立即重設密碼';
                    showAlert('連線至伺服器失敗，請確認服務已啟動');
                }
            });
        }

        // 彩蛋 Modal「好啦！直接幫我登入」按鈕處理
        const easterEggBtn = document.getElementById('easterEggConfirmBtn');
        if (easterEggBtn) {
            easterEggBtn.addEventListener('click', function () {
                const easterEggModalEl = document.getElementById('samePasswordEasterEggModal');
                if (easterEggModalEl && typeof bootstrap !== 'undefined') {
                    const inst = bootstrap.Modal.getInstance(easterEggModalEl);
                    if (inst) inst.hide();
                }
                const targetUser = pendingEasterEggUser || {
                    username: document.getElementById('forgotUsernameInput')?.value.trim() || 'jyun',
                    name: 'Jyun',
                    role: '核心會員'
                };
                sessionStorage.setItem('currentUser', JSON.stringify({
                    username: targetUser.username,
                    name: targetUser.name || targetUser.username,
                    role: targetUser.role || '一般會員',
                    loginTime: new Date().toISOString()
                }));
                showToast(`🎉 歡迎回來，${targetUser.name || targetUser.username}！正在為您自動登入...`, 'bi-check-circle-fill text-success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
        }

        // 輔助防 XSS
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
