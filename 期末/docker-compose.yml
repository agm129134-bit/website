name: web-library

services:
  web-library:
    build: .
    container_name: web-library
    restart: unless-stopped
    ports:
      # 外部映射端口設為 8095 (容器內部仍為 8090)
      # 徹底避開本地正在運行的 node server.js (佔用 8090) 的端口綁定衝突！
      - "8095:8090"
    volumes:
      # Docker 專用具名 volume (與本機 node server.js 的 ./data 分開)：
      # NeDB 不支援多個程序同時寫同一份檔案，兩邊共用會互相覆蓋
      # 備份: docker cp web-library:/app/data ./data-backup
      - web-library-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8090

volumes:
  web-library-data:
