name: web-library

services:
  web-library:
    build: .
    container_name: web-library
    restart: unless-stopped
    ports:
      # 外部映射端口設為 8095 (容器內部仍為 8090)
      # 徹底避開本地正在運行的 node server.js (佔用 8090) 的端口綁定衝突！
      - "8095:8090"
    volumes:
      # 掛載本地 data 資料夾至容器內部，實現書籤與用戶資料永久持久化
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8090
