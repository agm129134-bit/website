<!DOCTYPE html>
<html>
<head>
  <title>My first Vue page</title>
   
</head>
<body>

<h1>Example with methods</h1>

<p>Vue.js</p>

<div id="app">
  {{ message }} 
  <button v-on:click="clickHandle">click me</button>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
  var app = Vue.createApp({
   data() {
    return {
     message: "Hello World!"
    }
   },
   methods: {
   clickHandle(){
      this.message = "You clicked me!";
    }
  }
})
app.mount('#app')

</script>

</body>
</html>
